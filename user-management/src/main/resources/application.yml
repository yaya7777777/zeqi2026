# =====================================================================================================================
# 🏗️ Spring Boot 核心配置文件（application.yml = Python 的 config.ini / Java 的 properties 升级版）
# =====================================================================================================================
# 💡 为什么用 .yml 不用 .properties？
#    yml 用缩进表示层级，看一眼就知道「server.port 属于 server 这个大对象」，比 properties 的扁平键值对直观得多。
#    Spring Boot 启动时会自动扫描 src/main/resources/application.yml（或 application.properties）并加载。

server:
  port: 5000                                    # 服务端口：和 Python 版保持一致，Postman 测试脚本一个字不用改！
  servlet:
    context-path: /                             # URL 根路径（默认 /，也可以改成 /api/v1 加版本前缀）
    encoding:
      charset: UTF-8                            # Servlet 请求/响应强制 UTF-8，防止中文乱码
      enabled: true
      force: true

spring:
  # --------- H2 数据库配置（嵌入式零安装，MySQL 语法高度兼容） ---------
  datasource:
    # 【模式 A】内存模式（程序关了数据就没了，演示用最方便，重启自动清空）
    # url: jdbc:h2:mem:usersdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    # 【模式 B】文件模式（和 SQLite 一样持久化到磁盘 ./data/ 文件夹，重启还在）⭐ 推荐日常用
    url: jdbc:h2:file:./data/usersdb;AUTO_SERVER=TRUE;MODE=MySQL
    driver-class-name: org.h2.Driver            # H2 JDBC 驱动类全限定名
    username: sa                                # H2 默认用户名 sa（H2 自带，不用改）
    password:                                   # 内存/文件模式可以空密码
    # 数据库连接池 HikariCP（Spring Boot 2.x 默认，号称 Java 最快连接池）
    hikari:
      maximum-pool-size: 10                     # 最多 10 个连接，小项目完全够用
      minimum-idle: 2

  # --------- SQL 初始化：启动时自动执行 schema.sql（建表）和 data.sql（插测试数据） ---------
  sql:
    init:
      mode: always                              # always=每次启动都执行(配合 IF NOT EXISTS 安全)；embedded=仅内存库时执行
      schema-locations: classpath:schema.sql    # 建表脚本位置（src/main/resources/schema.sql）
      data-locations: classpath:data.sql        # 初始化测试数据脚本位置
      encoding: UTF-8

  # --------- H2 Web 控制台（💡 招新答辩神器！浏览器直接看数据库表，相当于自带的简易 Navicat） ---------
  h2:
    console:
      enabled: true                             # 开启 H2 控制台
      path: /h2-console                         # 访问地址：http://127.0.0.1:5000/h2-console
      settings:
        web-allow-others: false                 # 本机访问即可，false=安全，不允许局域网其他电脑访问
        trace: false

  # --------- Jackson JSON 序列化配置 ---------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss            # 日期格式化输出（数据库里的 TIMESTAMP 转前端字符串）
    time-zone: GMT+8
    default-property-inclusion: non_null        # 为 null 的字段不返回给前端（响应体更干净）

# --------- 日志级别 ---------
logging:
  level:
    root: INFO
    com.zeqi.usermanagement: DEBUG              # 我们自己的包开 DEBUG 级别，SQL 执行过程能看得清
    org.springframework.jdbc.core.JdbcTemplate: DEBUG   # 开这个后控制台会打印每一条执行的 SQL + 参数，调试神器
